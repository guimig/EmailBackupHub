name: Audit Historical Snapshot Content

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'snapshot_content_audit.py'
      - 'tests/test_snapshot_content_audit.py'
      - '.github/workflows/snapshot_content_audit.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run audit unit tests
        run: python -m unittest discover -s tests -p 'test_*snapshot*.py'
      - name: Inspect up to 1000 unreferenced old snapshots without deletion
        run: python snapshot_content_audit.py --limit 1000 --output snapshot-content-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-content-audit
          path: snapshot-content-audit.json
          retention-days: 14
