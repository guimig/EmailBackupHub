name: Batched Verified Snapshot Cleanup

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum verified empty snapshots (1-100)"
        required: true
        default: "100"
        type: choice
        options: ["10", "25", "50", "100"]
      apply:
        description: "Create a reviewable cleanup pull request (never delete from main directly)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: verified-snapshot-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate scripts and guards
        run: python -m unittest discover -s tests -p 'test_*snapshot*.py'
      - name: Prepare SHA-256 manifest without changes
        env:
          BATCH_LIMIT: ${{ inputs.limit }}
        run: python verified_snapshot_cleanup.py --limit "$BATCH_LIMIT" --manifest snapshot-cleanup-batch.json
      - name: Upload review manifest
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-cleanup-batch-${{ github.run_id }}
          path: snapshot-cleanup-batch.json
          retention-days: 30
      - name: Create deletion PR for verified empty snapshots only
        if: ${{ inputs.apply }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_LIMIT: ${{ inputs.limit }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main" || { echo "Refusing non-main checkout"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          items = json.loads(Path("snapshot-cleanup-batch.json").read_text())["selected"]
          if not items:
              raise SystemExit("No eligible snapshots: no PR needed")
          print(f"Manifest contains {len(items)} verified candidates")
          PY
          branch="maintenance/empty-snapshots-run-${RUN_ID}"
          git switch -c "$branch"
          python verified_snapshot_cleanup.py --limit "$BATCH_LIMIT" --manifest applied-snapshot-cleanup-batch.json --apply --confirm DELETE_VERIFIED_EMPTY_SNAPSHOTS
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path("snapshot-cleanup-batch.json").read_text())["selected"]
          after = json.loads(Path("applied-snapshot-cleanup-batch.json").read_text())["selected"]
          assert before == after, "Candidate selection changed between review and apply"
          assert before, "No candidates"
          assert all(not Path(item["path"]).exists() for item in before), "Some deletions failed"
          PY
          git diff --name-only --diff-filter=D > deleted-files.txt
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {x["path"] for x in json.loads(Path("snapshot-cleanup-batch.json").read_text())["selected"]}
          actual = set(Path("deleted-files.txt").read_text().splitlines())
          assert actual == expected, f"Unexpected deletions: {actual ^ expected}"
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/snapshots
          git diff --cached --name-only --diff-filter=ACMR | grep . && { echo "Unexpected additions or modifications"; exit 1; } || true
          git commit -m "Remove verified empty snapshot batch from run ${RUN_ID}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Cleanup verified empty snapshots (run ${RUN_ID})" --body "Automated bounded deletion of up to ${BATCH_LIMIT} historical empty snapshots. All candidates verified against SHA-256, cache references, age and light_snapshot marker. Review manifest in Actions run ${RUN_ID}. No financial-data snapshots intentionally removed. This PR must be reviewed before merge; historical Git objects are not rewritten."
