name: Process Emails and Update Repository

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'emails/**'
      - 'docs/**'
      - 'README.md'
      - '*.html'

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

      - name: Validate static baseline and data
        run: |
          python validate_baseline.py
          python validate_data.py
          python diagnose_headers.py --max-rows 8 restos-a-pagar-rap.html

      - name: Run the email processing script
        run: |
          python main.py
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}

      - name: Validate generated repository state
        run: |
          python validate_baseline.py
          python validate_data.py
