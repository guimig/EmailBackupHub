name: Parser Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'diagnose_headers.py'
      - 'compare_parser_outputs.py'
      - 'diagnose_rap_totals.py'
      - 'experimental_rap_metrics.py'
      - 'experimental_table_parser.py'
      - 'generate_parser_pilot.py'
      - 'rap_metrics.py'
      - 'validate_parser_pilot.py'
      - 'validate_parser_promotion_guard.py'
      - 'data_generator.py'
      - 'tests/test_diagnose_headers.py'
      - 'tests/test_compare_parser_outputs.py'
      - 'tests/test_diagnose_rap_totals.py'
      - 'tests/test_experimental_rap_metrics.py'
      - 'tests/test_experimental_table_parser.py'
      - 'tests/test_generate_parser_pilot.py'
      - 'tests/test_merged_header_cases.py'
      - 'tests/test_rap_metrics.py'
      - 'tests/test_validate_parser_pilot.py'
      - 'tests/test_validate_parser_promotion_guard.py'
      - '.github/workflows/parser_diagnostics.yml'
  push:
    branches:
      - main
    paths:
      - 'diagnose_headers.py'
      - 'compare_parser_outputs.py'
      - 'diagnose_rap_totals.py'
      - 'experimental_rap_metrics.py'
      - 'experimental_table_parser.py'
      - 'generate_parser_pilot.py'
      - 'rap_metrics.py'
      - 'validate_parser_pilot.py'
      - 'validate_parser_promotion_guard.py'
      - 'data_generator.py'
      - 'tests/test_diagnose_headers.py'
      - 'tests/test_compare_parser_outputs.py'
      - 'tests/test_diagnose_rap_totals.py'
      - 'tests/test_experimental_rap_metrics.py'
      - 'tests/test_experimental_table_parser.py'
      - 'tests/test_generate_parser_pilot.py'
      - 'tests/test_merged_header_cases.py'
      - 'tests/test_rap_metrics.py'
      - 'tests/test_validate_parser_pilot.py'
      - 'tests/test_validate_parser_promotion_guard.py'
      - '.github/workflows/parser_diagnostics.yml'

permissions:
  contents: read

jobs:
  parser-diagnostics:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/
            tests/
            *.py
            requirements.txt
            restos-a-pagar-rap.html
            saldos-de-contas-de-contratos.html
            evolucao-das-despesas-empenhadas.html
            despesas-empenhadas-liquidadas-e-pagas-mes-lancamento.html
            saldos-de-empenhos-do-exercicio-conta-contabil.html
            saldo-de-empenhos-a-liquidar-mes-a-mes.html
            credito-disponivel-mes-lancamento.html
            provisionamentos.html
            recolhimento-proprio-gru.html

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run parser unit tests
        run: |
          python -m unittest tests.test_diagnose_headers tests.test_compare_parser_outputs tests.test_diagnose_rap_totals tests.test_experimental_rap_metrics tests.test_experimental_table_parser tests.test_generate_parser_pilot tests.test_merged_header_cases tests.test_rap_metrics tests.test_validate_parser_pilot tests.test_validate_parser_promotion_guard

      - name: Guard experimental parser isolation
        run: |
          set +e
          python validate_parser_promotion_guard.py --report parser-promotion-guard.md
          guard_exit_code=$?
          echo "$guard_exit_code" > parser-promotion-guard.exit
          exit 0

      - name: Generate header diagnostics
        run: |
          python diagnose_headers.py > header-diagnostics.md

      - name: Generate parser comparison
        run: |
          python compare_parser_outputs.py --json-output parser-comparison.json > parser-comparison.md

      - name: Generate RAP diagnostics
        run: |
          python diagnose_rap_totals.py > rap-diagnostics.md

      - name: Generate parser pilot artifact
        run: |
          python generate_parser_pilot.py --all-default-pilots

      - name: Validate parser pilot artifact
        run: |
          for artifact in artifacts/parser-pilot-*.json; do
            python validate_parser_pilot.py "$artifact"
          done

      - name: Publish parser pilot summary
        if: always()
        run: |
          {
            echo "## Parser promotion guard"
            echo
            if [ -f parser-promotion-guard.md ]; then
              cat parser-promotion-guard.md
            else
              echo "Relatorio da guarda nao foi gerado."
            fi
            echo
            echo "## Parser pilot review"
            echo
            if [ -f artifacts/parser-pilot-index.md ]; then
              cat artifacts/parser-pilot-index.md
            else
              echo "Indice dos pilotos nao foi gerado."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-diagnostics
          if-no-files-found: warn
          path: |
            header-diagnostics.md
            parser-comparison.md
            parser-comparison.json
            parser-promotion-guard.md
            parser-promotion-guard.exit
            rap-diagnostics.md
            artifacts/parser-pilot-*.json
            artifacts/parser-pilot-*.md
            artifacts/experimental-reports/*.json

      - name: Fail if parser promotion guard failed
        if: always()
        run: |
          if [ -f parser-promotion-guard.exit ] && [ "$(cat parser-promotion-guard.exit)" != "0" ]; then
            echo "Parser promotion guard failed. See parser-promotion-guard.md."
            exit 1
          fi
