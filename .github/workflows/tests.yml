name: Unit Tests

on:
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/email_processor.yml'
      - '.github/workflows/parser_diagnostics.yml'
      - '.github/workflows/tests.yml'
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/email_processor.yml'
      - '.github/workflows/parser_diagnostics.yml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/
            assets/
            tests/
            *.py
            requirements.txt
            index.html
            dashboard.html
            relatorios.html
            report-viewer.html
            restos-a-pagar-rap.html
            saldos-de-contas-de-contratos.html
            evolucao-das-despesas-empenhadas.html
            despesas-empenhadas-liquidadas-e-pagas-mes-lancamento.html
            saldos-de-empenhos-do-exercicio-conta-contabil.html
            saldo-de-empenhos-a-liquidar-mes-a-mes.html
            credito-disponivel-mes-lancamento.html
            provisionamentos.html
            recolhimento-proprio-gru.html
            data/reports/recolhimento-proprio-gru.json
            data/reports/despesas-empenhadas-liquidadas-e-pagas-mes-lancamento.json
            data/reports/credito-disponivel-mes-lancamento.json
            data/reports/saldo-de-empenhos-a-liquidar-mes-a-mes.json
            data/reports/restos-a-pagar-rap.json
            data/series/despesas-empenhadas-liquidadas-e-pagas-mes-lancamento.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

      - name: Validate browser financial calculations
        run: node tests/test_financial_numbers.js

      - name: Validate report viewer JavaScript and UI regression tests
        run: |
          node --check assets/js/report-viewer-filters.js
          node --check assets/js/report-schema-guard.js
          node --check assets/js/report-viewer.js
          node --check assets/js/report-chart-explorer.js
          node --check assets/js/report-viewer-presets.js
          node --check assets/js/interactive-charts.js
          node --check assets/js/dashboard.js
          node --check tests/dashboard_rap_management.test.cjs
          node --check assets/js/financial-chart-provenance.js
          node --check assets/js/report-catalog.js
          node --test tests/dashboard_stage1.test.cjs tests/dashboard_stage2.test.cjs tests/report_viewer_stage3.test.cjs tests/interactive_charts_stage4.test.cjs tests/interactive_charts_stage5.test.cjs tests/chart_security_stage6.test.cjs tests/report_viewer_presets_stage7.test.cjs tests/report_catalog_stage8.test.cjs tests/financial_chart_provenance.test.cjs tests/report_chart_explorer.test.cjs tests/dashboard_rap_management.test.cjs tests/report_schema_guard.test.cjs

      - name: Browser UX smoke test (desktop and mobile)
        run: |
          node --check tests/viewer_smoke_browser.js
          node --check tests/smart_chart_browser.js
          node --check tests/viewer_browser_smoke.cjs
          node tests/viewer_browser_smoke.cjs

      - name: Upload viewer UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-ux-preview
          path: artifacts/viewer-ui/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Browser dashboard charts smoke test (desktop and mobile)
        run: |
          node --check tests/dashboard_smoke_browser.js
          node --check tests/dashboard_browser_smoke.cjs
          node tests/dashboard_browser_smoke.cjs

      - name: Upload dashboard UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-ux-preview
          path: artifacts/dashboard-ui/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Validate static baseline and data
        run: |
          # This sparse checkout contains only four real JSON fixtures for
          # financial provenance tests, not the complete generated data tree.
          # Keep the existing validator's sparse-checkout behavior, without
          # weakening its production rules or changing the Git repository.
          if [ -d data ] && [ ! -f data/index.json ]; then
            mv data "$RUNNER_TEMP/emailbackuphub-reference-fixtures"
          fi
          python validate_baseline.py
          python validate_data.py
          python diagnose_headers.py --max-rows 8 restos-a-pagar-rap.html
