name: Unit Tests

on:
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/email_processor.yml'
      - '.github/workflows/parser_diagnostics.yml'
      - '.github/workflows/tests.yml'
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/email_processor.yml'
      - '.github/workflows/parser_diagnostics.yml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/
            assets/
            tests/
            *.py
            requirements.txt
            index.html
            dashboard.html
            relatorios.html
            report-viewer.html
            restos-a-pagar-rap.html
            saldos-de-contas-de-contratos.html
            evolucao-das-despesas-empenhadas.html
            despesas-empenhadas-liquidadas-e-pagas-mes-lancamento.html
            saldos-de-empenhos-do-exercicio-conta-contabil.html
            saldo-de-empenhos-a-liquidar-mes-a-mes.html
            credito-disponivel-mes-lancamento.html
            provisionamentos.html
            recolhimento-proprio-gru.html

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

      - name: Validate static baseline and data
        run: |
          python validate_baseline.py
          python validate_data.py
          python diagnose_headers.py --max-rows 8 restos-a-pagar-rap.html
