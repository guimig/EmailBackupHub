<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualizador de Relatório</title>
  <link rel="stylesheet" href="assets/css/report-viewer.css">
</head>
<body>
  <header>
    <div class="header-top">
      <div class="header-main">
        <p><a href="dashboard.html">← Dashboard</a> | <a href="relatorios.html">Listagem</a> | <a id="htmlLink" href="#">HTML original</a> | <a id="jsonLink" href="#">JSON</a></p>
        <h1 id="title">Carregando relatório...</h1>
        <div class="meta" id="meta"></div>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button">Tema claro</button>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <input id="globalSearch" type="search" placeholder="Pesquisar em todas as colunas">
      <label class="toggle"><input id="showTotals" type="checkbox" checked> Mostrar totais</label>
      <button id="clearFilters">Limpar filtros</button>
      <button id="exportCsv">Exportar CSV</button>
      <button id="exportHtml">Exportar HTML</button>
      <button id="printHtml">Imprimir PDF</button>
    </div>
    <div id="quality" class="quality"></div>
    <div id="metricAudit" class="metric-audit is-hidden"></div>
    <details class="viewer-controls">
      <summary>Colunas, agrupamento e somas</summary>
      <div class="viewer-controls-body">
        <div>
          <strong>Colunas visíveis</strong>
          <div id="columnVisibilityOptions" class="control-grid"></div>
        </div>
        <div class="control-row">
          <label>
            <span>Agrupar por</span>
            <select id="groupColumn"></select>
          </label>
          <div>
            <strong>Somar por grupo</strong>
            <div id="groupSumOptions" class="control-grid"></div>
          </div>
        </div>
      </div>
    </details>
    <section id="filterEditor" class="filter-editor" aria-labelledby="filterEditorTitle" hidden>
      <div class="filter-editor-heading">
        <h2 id="filterEditorTitle">Filtro de coluna</h2>
        <button type="button" id="closeFilterEditor" class="secondary-button" aria-label="Fechar filtro">Fechar</button>
      </div>
      <div id="filterEditorFields" class="filter-editor-fields"></div>
      <div class="filter-editor-actions">
        <button type="button" id="applyColumnFilter">Aplicar filtro</button>
        <button type="button" id="removeColumnFilter" class="secondary-button">Remover filtro</button>
        <p id="filterError" role="alert" class="filter-error" hidden></p>
      </div>
    </section>
    <div id="filterChips" class="filter-chips" aria-live="polite"></div>
    <section class="table-wrap" aria-label="Resultados filtrados">
      <table id="table"></table>
    </section>
    <nav class="pagination" aria-label="Paginação dos resultados">
      <span id="pageInfo" role="status" aria-live="polite">Carregando registros...</span>
      <div class="page-controls">
        <label for="pageSize">Linhas por página</label>
        <select id="pageSize" aria-label="Linhas por página">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
        </select>
        <button type="button" id="previousPage" class="secondary-button">Anterior</button>
        <span id="pageNumber">Página 1 de 1</span>
        <button type="button" id="nextPage" class="secondary-button">Próxima</button>
      </div>
    </nav>
  </main>
  <footer class="site-footer">
    <span>Desenvolvido por Guilherme Migliorini.</span>
    <a href="https://github.com/guimig/EmailBackupHub">Página do GitHub</a>
  </footer>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/report-viewer-filters.js"></script>
  <script src="assets/js/report-viewer.js"></script>
</body>
</html>
