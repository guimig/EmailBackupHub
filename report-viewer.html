<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualizador de Relatório</title>
  <style>
    :root { color-scheme: dark; --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #c9d1d9; --muted: #8b949e; --brand: #58a6ff; --total: #332b00; --warn: #f2cc60; --ok: #56d364; --bad: #ff7b72; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 20px; border-bottom: 1px solid var(--line); background: #0b1018; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }
    main { padding: 16px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); }
    .tag { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: var(--panel); }
    .toolbar { display: grid; grid-template-columns: 1fr auto auto auto; gap: 10px; margin: 16px 0; }
    input, button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 10px 12px; }
    label.toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 10px 12px; white-space: nowrap; }
    label.toggle input { padding: 0; }
    button { cursor: pointer; color: #0d1117; background: var(--brand); border-color: var(--brand); font-weight: 700; }
    .table-wrap { border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 72vh; background: var(--panel); }
    table { border-collapse: collapse; width: 100%; min-width: 900px; }
    th, td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 8px; vertical-align: top; }
    th { position: sticky; top: 0; background: #21262d; z-index: 2; }
    th input { width: 100%; margin-top: 6px; padding: 6px; font-size: 0.82rem; }
    tbody tr:hover td { background: #1c2129; }
    .total-row td { background: var(--total); font-weight: 700; }
    .totals { margin: 12px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
    .totals summary { cursor: pointer; padding: 10px 12px; color: var(--warn); font-weight: 700; }
    .totals-list { display: grid; gap: 8px; padding: 0 12px 12px; color: var(--muted); }
    .totals-list div { border-top: 1px solid var(--line); padding-top: 8px; }
    .quality { margin: 12px 0; color: var(--muted); }
    .quality.bad { color: var(--warn); }
    @media (max-width: 800px) { .toolbar { grid-template-columns: 1fr; } main { padding: 10px; } }
  </style>
</head>
<body>
  <header>
    <p><a href="dashboard.html">← Dashboard</a> | <a id="htmlLink" href="#">HTML original</a> | <a id="jsonLink" href="#">JSON</a></p>
    <h1 id="title">Carregando relatório...</h1>
    <div class="meta" id="meta"></div>
  </header>
  <main>
    <div class="toolbar">
      <input id="globalSearch" type="search" placeholder="Pesquisar em todas as colunas">
      <label class="toggle"><input id="showTotals" type="checkbox"> Mostrar totais</label>
      <button id="clearFilters">Limpar filtros</button>
      <button id="exportCsv">Exportar CSV</button>
    </div>
    <div id="quality" class="quality"></div>
    <details id="totalsPanel" class="totals" style="display:none;">
      <summary id="totalsSummary">Totais separados</summary>
      <div id="totalsList" class="totals-list"></div>
    </details>
    <section class="table-wrap">
      <table id="table"></table>
    </section>
  </main>
  <script>
    let report = null;
    let columnFilters = {};
    let renderTimer = null;
    const byId = id => document.getElementById(id);
    const normalize = text => (text || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

    function reportUrl() {
      const params = new URLSearchParams(location.search);
      return params.get('report') || 'data/index.json';
    }

    async function loadReport() {
      const url = reportUrl();
      const response = await fetch(url);
      report = await response.json();
      byId('title').textContent = report.title || 'Relatório';
      byId('htmlLink').href = report.html_path || '#';
      byId('jsonLink').href = url;
      byId('meta').innerHTML = [
        `Data: ${report.date || '-'}`,
        `Periodicidade: ${report.metadata?.periodicidade || '-'}`,
        `Status: ${report.metadata?.status || '-'}`,
        `Idade: ${report.metadata?.idade_dias ?? '-'} dias`,
        `Exercício: ${report.metadata?.exercicio || '-'}`,
        `Linhas: ${report.metadata?.row_count ?? 0}`
      ].map(text => `<span class="tag">${escapeHtml(text)}</span>`).join('');
      byId('quality').textContent = report.quality?.ok ? 'Parsing concluído sem alertas.' : `Alertas de parsing: ${(report.quality?.issues || []).join(', ')}`;
      byId('quality').className = report.quality?.ok ? 'quality' : 'quality bad';
      columnFilters = {};
      renderTableShell();
      renderTotals();
      renderRows();
    }

    function filteredRows() {
      const term = normalize(byId('globalSearch').value);
      return visibleRows().filter(item => {
        const row = item.raw || item;
        const values = Object.values(row).join(' ');
        if (term && !normalize(values).includes(term)) return false;
        return Object.entries(columnFilters).every(([column, value]) => !value || normalize(row[column]).includes(normalize(value)));
      });
    }

    function visibleRows() {
      if (byId('showTotals').checked && Array.isArray(report.row_types) && report.row_types.length) {
        return report.row_types;
      }
      return (report.rows || []).map(row => ({ type: 'data', raw: row }));
    }

    function renderTotals() {
      const totals = report.totals || [];
      byId('totalsPanel').style.display = totals.length ? 'block' : 'none';
      byId('totalsSummary').textContent = `${totals.length} linha(s) de total separada(s)`;
      byId('totalsList').innerHTML = totals.map(total => {
        const values = Object.entries(total.values || {}).map(([key, value]) => `${escapeHtml(key)}: ${escapeHtml(value)}`).join(' | ');
        return `<div><strong>${escapeHtml(total.label || 'Total')}</strong>${values ? `<br>${values}` : ''}</div>`;
      }).join('');
    }

    function renderTableShell() {
      const columns = report.columns || [];
      byId('table').innerHTML = `
        <thead><tr>${columns.map(column => `<th>${escapeHtml(column)}<input data-column="${escapeHtml(column)}" placeholder="Filtrar"></th>`).join('')}</tr></thead>
        <tbody></tbody>
      `;
      document.querySelectorAll('th input').forEach(input => {
        input.addEventListener('input', event => {
          columnFilters[event.target.dataset.column] = event.target.value;
          scheduleRenderRows();
        });
      });
    }

    function scheduleRenderRows() {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(renderRows, 250);
    }

    function renderRows() {
      if (!report) return;
      const columns = report.columns || [];
      const rows = filteredRows();
      const tbody = byId('table').querySelector('tbody');
      tbody.innerHTML = rows.map(item => {
        const row = item.raw || item;
        const isTotal = item.type === 'total';
        return `<tr class="${isTotal ? 'total-row' : ''}">${columns.map(column => `<td>${escapeHtml(row[column])}</td>`).join('')}</tr>`;
      }).join('');
    }

    function exportCsv() {
      const columns = report.columns || [];
      const lines = [columns.map(csvCell).join(',')];
      for (const item of filteredRows()) {
        const row = item.raw || item;
        lines.push(columns.map(column => csvCell(row[column])).join(','));
      }
      download(`${report.slug || 'relatorio'}.csv`, lines.join('\n'));
    }

    function csvCell(value) { return `"${String(value || '').replace(/"/g, '""')}"`; }
    function download(name, content) {
      const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = name;
      link.click();
      URL.revokeObjectURL(url);
    }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
    }

    byId('globalSearch').addEventListener('input', scheduleRenderRows);
    byId('clearFilters').addEventListener('click', () => {
      columnFilters = {};
      byId('globalSearch').value = '';
      byId('showTotals').checked = false;
      document.querySelectorAll('th input').forEach(input => { input.value = ''; });
      renderRows();
    });
    byId('exportCsv').addEventListener('click', exportCsv);
    byId('showTotals').addEventListener('change', renderRows);
    loadReport().catch(error => { byId('title').textContent = `Erro ao carregar relatório: ${error.message}`; });
  </script>
</body>
</html>
