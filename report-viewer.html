<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualizador de Relatório</title>
  <style>
    :root,
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1117;
      --header: #0b1018;
      --panel: #161b22;
      --soft: #1c2129;
      --line: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --brand: #58a6ff;
      --brand-contrast: #0d1117;
      --total: #332b00;
      --warn: #f2cc60;
      --ok: #56d364;
      --bad: #ff7b72;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f8fbf7;
      --header: #eef6ed;
      --panel: #ffffff;
      --soft: #edf6ed;
      --line: #dce6dc;
      --text: #233128;
      --muted: #657269;
      --brand: #2f7a3e;
      --brand-contrast: #ffffff;
      --total: #fff4c2;
      --warn: #9a6a00;
      --ok: #2f7a3e;
      --bad: #b42318;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 20px; border-bottom: 1px solid var(--line); background: var(--header); }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .header-main { min-width: 0; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }
    main { padding: 16px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); }
    .tag { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: var(--panel); }
    .toolbar { display: grid; grid-template-columns: 1fr auto auto auto; gap: 10px; margin: 16px 0; }
    input, select, button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 10px 12px; }
    label.toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 10px 12px; white-space: nowrap; }
    label.toggle input { padding: 0; }
    button { cursor: pointer; color: var(--brand-contrast); background: var(--brand); border-color: var(--brand); font-weight: 700; }
    .theme-toggle { flex: 0 0 auto; min-width: 132px; }
    .table-wrap { border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 72vh; background: var(--panel); }
    table { border-collapse: collapse; width: 100%; min-width: 900px; }
    th, td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 8px; vertical-align: top; }
    th { position: sticky; top: 0; background: var(--soft); z-index: 2; }
    th input, th select { width: 100%; margin-top: 6px; padding: 6px; font-size: 0.82rem; }
    tbody tr:hover td { background: var(--soft); }
    .total-row td { background: var(--total); font-weight: 700; }
    .totals { margin: 12px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
    .totals summary { cursor: pointer; padding: 10px 12px; color: var(--warn); font-weight: 700; }
    .totals-list { display: grid; gap: 8px; padding: 0 12px 12px; color: var(--muted); }
    .totals-list div { border-top: 1px solid var(--line); padding-top: 8px; }
    .quality { margin: 12px 0; color: var(--muted); }
    .quality.bad { color: var(--warn); }
    @media (max-width: 800px) { .header-top { display: block; } .theme-toggle { width: 100%; margin-top: 12px; } .toolbar { grid-template-columns: 1fr; } main { padding: 10px; } }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="header-main">
        <p><a href="dashboard.html">← Dashboard</a> | <a id="htmlLink" href="#">HTML original</a> | <a id="jsonLink" href="#">JSON</a></p>
        <h1 id="title">Carregando relatório...</h1>
        <div class="meta" id="meta"></div>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button">Tema claro</button>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <input id="globalSearch" type="search" placeholder="Pesquisar em todas as colunas">
      <label class="toggle"><input id="showTotals" type="checkbox"> Mostrar totais</label>
      <button id="clearFilters">Limpar filtros</button>
      <button id="exportCsv">Exportar CSV</button>
    </div>
    <div id="quality" class="quality"></div>
    <details id="totalsPanel" class="totals" style="display:none;">
      <summary id="totalsSummary">Totais separados</summary>
      <div id="totalsList" class="totals-list"></div>
    </details>
    <section class="table-wrap">
      <table id="table"></table>
    </section>
  </main>
  <script>
    let report = null;
    let columnFilters = {};
    let columnSort = { column: null, direction: '' };
    let renderTimer = null;
    const byId = id => document.getElementById(id);

    const THEME_KEY = 'dap-dashboard-theme';

    function applyTheme(theme) {
      const nextTheme = theme === 'light' ? 'light' : 'dark';
      document.documentElement.dataset.theme = nextTheme;
      try { localStorage.setItem(THEME_KEY, nextTheme); } catch {}
      const button = byId('themeToggle');
      if (button) button.textContent = nextTheme === 'dark' ? 'Tema claro' : 'Tema escuro';
    }

    function initTheme() {
      let storedTheme = 'dark';
      try { storedTheme = localStorage.getItem(THEME_KEY) || 'dark'; } catch {}
      applyTheme(storedTheme);
    }

    const normalize = text => (text || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const infoQualityCodes = new Set(['date_from_filename', 'date_from_mtime', 'inconsistent_columns', 'totals_separated']);
    const qualityLabels = {
      date_from_filename: 'data obtida pelo nome do arquivo',
      date_from_mtime: 'data obtida pela modificação do arquivo',
      inconsistent_columns: 'largura de linhas normalizada',
      totals_separated: 'totais separados da tabela principal'
    };
    const reportFriendlyNames = {
      '2024-acompanhamento-das-liquidacoes-e-pagamentos-por-natureza-de-despesa': 'Liquidacoes e Pagamentos por Natureza - 2024',
      '2025-acompanhamento-das-liquidacoes-e-pagamentos-por-natureza-de-despesa': 'Liquidacoes e Pagamentos por Natureza - 2025',
      'acompanhamento-das-liquidacoes-e-pagamentos-por-data': 'Liquidacoes e Pagamentos por Data',
      'acompanhamento-das-liquidacoes-e-pagamentos-por-natureza-de-despesa': 'Liquidacoes e Pagamentos por Natureza',
      'credito-disponivel-mes-lancamento': 'Credito Disponivel por Mes de Lancamento',
      'despesas-empenhadas-liquidadas-e-pagas-2024': 'Despesas Empenhadas, Liquidadas e Pagas - 2024',
      'despesas-empenhadas-liquidadas-e-pagas-2025': 'Despesas Empenhadas, Liquidadas e Pagas - 2025',
      'despesas-empenhadas-liquidadas-e-pagas-mes-lancamento': 'Despesas Empenhadas, Liquidadas e Pagas por Mes',
      'despesas-empenhadas-liquidadas-e-pagas-strictu-sensu': 'Despesas Empenhadas, Liquidadas e Pagas - Stricto Sensu',
      'evolucao-das-despesas-empenhadas': 'Evolucao das Despesas Empenhadas',
      'imoveis-por-ug-conta-contabil-e-rip': 'Imoveis por UG, Conta Contabil e RIP',
      'limite-de-saque-conta-contabil': 'Limite de Saque por Conta Contabil',
      'provisionamentos': 'Provisionamentos',
      'recolhimento-proprio-gru': 'Recolhimento Proprio - GRU',
      'restos-a-pagar-rap': 'Restos a Pagar - RAP',
      'saldo-de-empenhos-a-liquidar-mes-a-mes': 'Saldo de Empenhos a Liquidar Mes a Mes',
      'saldo-patrimonio-e-almoxarifado-conta-contabil': 'Saldo de Patrimonio e Almoxarifado por Conta Contabil',
      'saldo-por-natureza-de-despesa': 'Saldo por Natureza de Despesa',
      'saldos-de-contas-de-contratos': 'Saldos de Contas de Contratos',
      'saldos-de-empenhos-do-exercicio-conta-contabil': 'Saldos de Empenhos do Exercicio por Conta Contabil',
      'suprimento-de-fundos-empenhos': 'Suprimento de Fundos - Empenhos',
      'suprimento-de-fundos-liquidacoes-e-pagamentos': 'Suprimento de Fundos - Liquidacoes e Pagamentos'
    };
    const columnFriendlyNames = {
      'acompanhamento-das-liquidacoes-e-pagamentos-por-data': ['Data', 'Empenhado', 'Liquidado', 'Pago', 'Saldo a Liquidar'],
      'acompanhamento-das-liquidacoes-e-pagamentos-por-natureza-de-despesa': ['Natureza de Despesa', 'Empenhado', 'Liquidado', 'Pago', 'Saldo a Liquidar'],
      'credito-disponivel-mes-lancamento': ['Mes', 'Credito Inicial', 'Credito Atualizado', 'Credito Disponivel'],
      'despesas-empenhadas-liquidadas-e-pagas-mes-lancamento': ['Mes', 'Empenhado', 'Liquidado', 'Pago', 'Liquidado a Pagar'],
      'despesas-empenhadas-liquidadas-e-pagas-strictu-sensu': ['Natureza de Despesa', 'Empenhado', 'Liquidado', 'Pago', 'Liquidado a Pagar'],
      'recolhimento-proprio-gru': ['Unidade Gestora', 'Codigo de Recolhimento', 'Descricao', 'Arrecadado'],
      'restos-a-pagar-rap': ['Unidade Gestora', 'Natureza de Despesa', 'Inscrito', 'Cancelado', 'Pago', 'A Pagar', '% Pago'],
      'saldo-de-empenhos-a-liquidar-mes-a-mes': ['Natureza de Despesa', 'Janeiro', 'Fevereiro', 'Marco', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro', 'Total a Liquidar'],
      'saldos-de-empenhos-do-exercicio-conta-contabil': ['Conta Contabil', 'Empenhado', 'A Liquidar', 'Liquidado a Pagar', 'Pago']
    };

    function reportUrl() {
      const params = new URLSearchParams(location.search);
      return params.get('report') || 'data/index.json';
    }

    async function loadReport() {
      const url = reportUrl();
      const response = await fetch(url);
      report = await response.json();
      byId('title').textContent = reportFriendlyNames[report.slug] || report.title || 'Relatório';
      byId('htmlLink').href = report.html_path || '#';
      byId('jsonLink').href = url;
      byId('meta').innerHTML = [
        `Data: ${report.date || '-'}`,
        `Periodicidade: ${report.metadata?.periodicidade || '-'}`,
        `Status: ${report.metadata?.status || '-'}`,
        `Idade: ${report.metadata?.idade_dias ?? '-'} dias`,
        `Exercício: ${report.metadata?.exercicio || '-'}`,
        `Linhas: ${report.metadata?.row_count ?? 0}`
      ].map(text => `<span class="tag">${escapeHtml(text)}</span>`).join('');
      const quality = qualitySummary(report);
      byId('quality').textContent = quality.text;
      byId('quality').className = quality.ok ? 'quality' : 'quality bad';
      columnFilters = {};
      columnSort = { column: null, direction: '' };
      renderTableShell();
      renderTotals();
      renderRows();
    }

    function filteredRows() {
      const term = normalize(byId('globalSearch').value);
      const rows = visibleRows().filter(item => {
        const row = item.raw || item;
        const values = Object.values(row).join(' ');
        if (term && !normalize(values).includes(term)) return false;
        return Object.entries(columnFilters).every(([column, value]) => !value || normalize(row[column]).includes(normalize(value)));
      });
      if (!columnSort.column || !columnSort.direction) return rows;
      return rows.sort((a, b) => {
        const av = sortCellValue((a.raw || a)[columnSort.column]);
        const bv = sortCellValue((b.raw || b)[columnSort.column]);
        return compareCellValues(av, bv) * (columnSort.direction === 'az' ? 1 : -1);
      });
    }

    function sortCellValue(value) {
      const number = parseBrNumber(value);
      return Number.isFinite(number) ? number : normalize(value);
    }

    function compareCellValues(a, b) {
      if (typeof a === 'number' && typeof b === 'number') return a - b;
      return String(a ?? '').localeCompare(String(b ?? ''), 'pt-BR', { numeric: true });
    }

    function visibleRows() {
      if (byId('showTotals').checked && Array.isArray(report.row_types) && report.row_types.length) {
        return report.row_types;
      }
      return (report.rows || []).map(row => ({ type: 'data', raw: row }));
    }

    function qualitySummary(report) {
      const quality = report.quality || {};
      const rawIssues = quality.issues || [];
      const warnings = [...(quality.warnings || []), ...rawIssues.filter(issue => infoQualityCodes.has(issue))];
      const issues = rawIssues.filter(issue => !infoQualityCodes.has(issue));
      if (issues.length) return { ok: false, text: `Problemas de parsing: ${issues.map(qualityLabel).join(', ')}` };
      if (warnings.length) return { ok: true, text: `Observações de leitura: ${[...new Set(warnings)].map(qualityLabel).join(', ')}` };
      return { ok: true, text: 'Parsing concluído sem problemas.' };
    }

    function qualityLabel(code) {
      return qualityLabels[code] || code;
    }

    function renderTotals() {
      const totals = report.totals || [];
      byId('totalsPanel').style.display = totals.length ? 'block' : 'none';
      byId('totalsSummary').textContent = `${totals.length} linha(s) de total separada(s)`;
      byId('totalsList').innerHTML = totals.map(total => {
        const values = Object.entries(total.values || {}).map(([key, value]) => `${escapeHtml(key)}: ${escapeHtml(value)}`).join(' | ');
        return `<div><strong>${escapeHtml(total.label || 'Total')}</strong>${values ? `<br>${values}` : ''}</div>`;
      }).join('');
    }

    function friendlyColumns(columns) {
      const friendly = columnFriendlyNames[report.slug] || [];
      const generated = columns.length && columns.every(column => /^Coluna \d+$/.test(column || ''));
      return columns.map((column, index) => {
        if (generated && friendly[index]) return friendly[index];
        if (/^Coluna \d+$/.test(column || '')) return index === 0 ? 'Descricao' : `Valor ${index}`;
        return column;
      });
    }

    function renderTableShell() {
      const columns = report.columns || [];
      const displayColumns = friendlyColumns(columns);
      byId('table').innerHTML = `
        <thead><tr>${columns.map((column, index) => `
          <th>
            ${escapeHtml(displayColumns[index])}
            <input data-column="${escapeHtml(column)}" placeholder="Filtrar">
            <select data-sort-column="${escapeHtml(column)}" aria-label="Ordenar ${escapeHtml(displayColumns[index])}">
              <option value="">Ordem original</option>
              <option value="az">A-Z</option>
              <option value="za">Z-A</option>
            </select>
          </th>
        `).join('')}</tr></thead>
        <tbody></tbody>
      `;
      document.querySelectorAll('th input').forEach(input => {
        input.addEventListener('input', event => {
          columnFilters[event.target.dataset.column] = event.target.value;
          scheduleRenderRows();
        });
      });
      document.querySelectorAll('th select').forEach(select => {
        select.addEventListener('change', event => {
          document.querySelectorAll('th select').forEach(item => {
            if (item !== event.target) item.value = '';
          });
          columnSort = { column: event.target.dataset.sortColumn, direction: event.target.value };
          renderRows();
        });
      });
    }

    function scheduleRenderRows() {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(renderRows, 250);
    }

    function renderRows() {
      if (!report) return;
      const columns = report.columns || [];
      const rows = filteredRows();
      const tbody = byId('table').querySelector('tbody');
      tbody.innerHTML = rows.map(item => {
        const row = item.raw || item;
        const isTotal = item.type === 'total';
        return `<tr class="${isTotal ? 'total-row' : ''}">${columns.map(column => `<td>${escapeHtml(row[column])}</td>`).join('')}</tr>`;
      }).join('');
    }

    function exportCsv() {
      const columns = report.columns || [];
      const displayColumns = friendlyColumns(columns);
      const lines = [displayColumns.map(csvCell).join(',')];
      for (const item of filteredRows()) {
        const row = item.raw || item;
        lines.push(columns.map(column => csvCell(row[column])).join(','));
      }
      download(`${report.slug || 'relatorio'}.csv`, lines.join('\n'));
    }

    function parseBrNumber(value) {
      if (typeof value === 'number') return value;
      const clean = String(value || '').replace(/[^\d,.-]/g, '');
      if (!clean) return null;
      const normalized = clean.includes(',') ? clean.replace(/\./g, '').replace(',', '.') : clean;
      const number = Number(normalized);
      return Number.isFinite(number) ? number : null;
    }

    function csvCell(value) { return `"${String(value || '').replace(/"/g, '""')}"`; }
    function download(name, content) {
      const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = name;
      link.click();
      URL.revokeObjectURL(url);
    }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
    }

    byId('globalSearch').addEventListener('input', scheduleRenderRows);
    byId('clearFilters').addEventListener('click', () => {
      columnFilters = {};
      columnSort = { column: null, direction: '' };
      byId('globalSearch').value = '';
      byId('showTotals').checked = false;
      document.querySelectorAll('th input').forEach(input => { input.value = ''; });
      document.querySelectorAll('th select').forEach(select => { select.value = ''; });
      renderRows();
    });
    byId('exportCsv').addEventListener('click', exportCsv);
    byId('themeToggle').addEventListener('click', () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
    initTheme();
    byId('showTotals').addEventListener('change', renderRows);
    loadReport().catch(error => { byId('title').textContent = `Erro ao carregar relatório: ${error.message}`; });
  </script>
</body>
</html>
